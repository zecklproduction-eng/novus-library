{% extends "base.html" %}

{% block content %}
<div class="messages-container">
    <div class="messages-wrapper">
        <!-- Sidebar: Conversation List -->
        <div class="conversations-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title-row">
                    <h2>Messages</h2>
                    <button class="new-chat-btn" id="newChatBtn" title="New Conversation">
                        <i class="fas fa-pen-to-square"></i>
                    </button>
                </div>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="convoSearch" placeholder="Search conversations...">
                </div>
                <!-- Search results dropdown -->
                <div class="user-search-results hidden" id="userSearchResults"></div>
            </div>
            <div class="conversations-list" id="conversationsList">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading chats...</p>
                </div>
            </div>
        </div>

        <!-- Main: Chat Window -->
        <div class="chat-main" id="chatMain">
            <!-- Empty state -->
            <div class="chat-empty-state" id="chatEmptyState">
                <div class="empty-icon">
                    <i class="fas fa-comments"></i>
                </div>
                <h3>Select a conversation</h3>
                <p>Choose a contact from the sidebar or start a new chat</p>
            </div>

            <!-- Chat active state -->
            <div class="chat-content hidden" id="chatContent">
                <div class="chat-header">
                    <div class="user-info">
                        <div class="avatar-wrapper">
                            <img src="" alt="" id="chatUserAvatar" class="user-avatar">
                            <span class="status-indicator online"></span>
                        </div>
                        <div class="user-details">
                            <h3 id="chatUserName"></h3>
                            <span class="user-status" id="chatUserStatus">Active now</span>
                        </div>
                    </div>
                    <div class="header-actions">
                        <button class="action-btn" id="btnVisitProfile" title="Visit Profile">
                            <i class="fas fa-user"></i>
                        </button>
                        <button class="action-btn danger-btn" id="btnDeleteConvo" title="Delete Conversation">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                        <button class="action-btn" id="btnToggleInfo" title="User Info">
                            <i class="fas fa-info-circle"></i>
                        </button>
                    </div>
                </div>

                <!-- User Info Panel (hidden by default) -->
                <div class="user-info-panel hidden" id="userInfoPanel">
                    <div class="info-panel-inner">
                        <img src="" alt="" id="infoPanelAvatar" class="info-avatar">
                        <h4 id="infoPanelName"></h4>
                        <span class="info-role" id="infoPanelRole"></span>
                        <div class="info-stats">
                            <div class="info-stat">
                                <span class="stat-label">Messages</span>
                                <span class="stat-value" id="infoPanelMsgCount">0</span>
                            </div>
                            <div class="info-stat">
                                <span class="stat-label">Since</span>
                                <span class="stat-value" id="infoPanelSince">—</span>
                            </div>
                        </div>
                        <button class="info-action-btn" id="infoPanelProfileBtn">
                            <i class="fas fa-external-link-alt"></i> View Full Profile
                        </button>
                    </div>
                </div>

                <div class="messages-display" id="messagesDisplay">
                    <!-- Messages will be loaded here -->
                </div>

                <div class="chat-input-area">
                    <!-- Image preview strip -->
                    <div class="img-preview-strip hidden" id="imgPreviewStrip">
                        <div class="img-preview-inner">
                            <img src="" alt="Preview" id="imgPreviewThumb">
                            <span id="imgPreviewName">image.jpg</span>
                            <button class="img-preview-cancel" id="imgPreviewCancel" title="Cancel">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                    <div class="input-wrapper">
                        <button class="icon-btn emoji-toggle" id="emojiToggle" title="Emoji">
                            <i class="fas fa-smile"></i>
                        </button>
                        <button class="icon-btn gif-toggle" id="gifToggle" title="GIFs">
                            <span class="gif-label">GIF</span>
                        </button>
                        <button class="icon-btn" id="imgUploadBtn" title="Send Image">
                            <i class="fas fa-image"></i>
                        </button>
                        <input type="file" id="imgFileInput" accept="image/*" style="display:none">
                        <textarea id="messageInput" placeholder="Type a message..." rows="1"></textarea>
                        <button class="send-btn" id="sendMessageBtn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    <!-- Emoji picker -->
                    <div class="emoji-picker hidden" id="emojiPicker">
                        <div class="emoji-grid" id="emojiGrid"></div>
                    </div>
                    <!-- GIF picker -->
                    <div class="gif-picker hidden" id="gifPicker">
                        <div class="gif-search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="gifSearchInput" placeholder="Search GIFs...">
                        </div>
                        <div class="gif-categories" id="gifCategories">
                            <button class="gif-cat active" data-q="">🔥 Trending</button>
                            <button class="gif-cat" data-q="lol">😂 LOL</button>
                            <button class="gif-cat" data-q="love">❤️ Love</button>
                            <button class="gif-cat" data-q="sad">😢 Sad</button>
                            <button class="gif-cat" data-q="reaction">😲 React</button>
                            <button class="gif-cat" data-q="thumbs up">👍 Yes</button>
                            <button class="gif-cat" data-q="no">👎 No</button>
                            <button class="gif-cat" data-q="anime">🎌 Anime</button>
                        </div>
                        <div class="gif-results" id="gifResults">
                            <div class="loading-state"><div class="spinner"></div></div>
                        </div>
                        <div class="gif-powered">Powered by Tenor</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* Messaging System Styles */
.messages-container {
    height: calc(100vh - 140px);
    padding: 0;
    max-width: 1400px;
    margin: 20px auto;
}

.messages-wrapper {
    display: flex;
    background: #0f0f19;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    height: 100%;
    overflow: hidden;
    box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
    position: relative;
    z-index: 5;
}

/* Sidebar */
.conversations-sidebar {
    width: 350px;
    border-right: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}

.sidebar-header {
    padding: 25px;
    position: relative;
}

.sidebar-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.sidebar-header h2 {
    font-family: 'Outfit', sans-serif;
    font-size: 1.8rem;
    margin: 0;
    color: #fff;
}

.new-chat-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(0, 212, 255, 0.3);
    background: rgba(0, 212, 255, 0.08);
    color: #00d4ff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    transition: all 0.2s;
}

.new-chat-btn:hover {
    background: #00d4ff;
    color: #000;
    transform: scale(1.05);
}

.search-box {
    position: relative;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    padding: 5px 15px;
    display: flex;
    align-items: center;
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: border-color 0.2s;
}

.search-box:focus-within {
    border-color: rgba(0, 212, 255, 0.4);
}

.search-box i {
    color: rgba(255, 255, 255, 0.4);
    margin-right: 10px;
}

.search-box input {
    background: none;
    border: none;
    color: #fff;
    width: 100%;
    padding: 10px 0;
    outline: none;
    font-size: 0.9rem;
}

/* User search results dropdown */
.user-search-results {
    position: absolute;
    top: 100%;
    left: 25px;
    right: 25px;
    background: #1a1a2e;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    max-height: 300px;
    overflow-y: auto;
    z-index: 20;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
}

.user-result-item {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    cursor: pointer;
    transition: background 0.15s;
    gap: 12px;
}

.user-result-item:hover {
    background: rgba(0, 212, 255, 0.08);
}

.user-result-item:first-child { border-radius: 12px 12px 0 0; }
.user-result-item:last-child { border-radius: 0 0 12px 12px; }

.user-result-item img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
}

.user-result-info {
    display: flex;
    flex-direction: column;
}

.user-result-info .name {
    color: #fff;
    font-weight: 600;
    font-size: 0.9rem;
}

.user-result-info .role {
    color: rgba(255, 255, 255, 0.4);
    font-size: 0.75rem;
    text-transform: capitalize;
}

.search-hint {
    padding: 15px;
    text-align: center;
    color: rgba(255, 255, 255, 0.4);
    font-size: 0.85rem;
}

.conversations-list {
    flex: 1;
    overflow-y: auto;
}

.convo-item {
    padding: 15px 20px;
    display: flex;
    align-items: center;
    cursor: pointer;
    transition: all 0.2s ease;
    border-left: 3px solid transparent;
}

.convo-item:hover {
    background: rgba(255, 255, 255, 0.03);
}

.convo-item.active {
    background: rgba(0, 212, 255, 0.05);
    border-left-color: #00d4ff;
}

.convo-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
    margin-right: 15px;
    flex-shrink: 0;
}

.convo-info {
    flex: 1;
    overflow: hidden;
    min-width: 0;
}

.convo-info .top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
}

.convo-info h4 {
    color: #fff;
    font-size: 1rem;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.convo-info .time {
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.4);
    flex-shrink: 0;
    margin-left: 8px;
}

.convo-info .last-msg {
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
}

.convo-item.unread .last-msg {
    color: #00d4ff;
    font-weight: 600;
}

.convo-item .unread-dot {
    width: 10px;
    height: 10px;
    background: #00d4ff;
    border-radius: 50%;
    flex-shrink: 0;
    margin-left: 8px;
    box-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
}

/* Chat Main */
.chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    background: #0a0a0f;
    min-width: 0;
}

.chat-empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: rgba(255, 255, 255, 0.4);
    text-align: center;
}

.empty-icon {
    font-size: 4rem;
    margin-bottom: 20px;
    opacity: 0.3;
}

.chat-content {
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
}

.chat-header {
    padding: 15px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    overflow: hidden;
    flex-shrink: 0;
    background: rgba(15, 15, 30, 0.5);
}

.chat-header .user-info {
    display: flex;
    align-items: center;
    min-width: 0;
}

.avatar-wrapper {
    position: relative;
    margin-right: 15px;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
}

.user-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
}

.status-indicator {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid #0f0f19;
}

.status-indicator.online { background: #22c55e; }

.chat-header .user-details { min-width: 0; }

.chat-header h3 {
    margin: 0;
    color: #fff;
    font-size: 1.1rem;
}

.user-status {
    font-size: 0.8rem;
    color: rgba(255, 255, 255, 0.4);
}

.header-actions {
    display: flex;
    gap: 5px;
    flex-shrink: 0;
}

.header-actions .action-btn {
    background: none;
    border: none;
    color: #00d4ff;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
}

.header-actions .action-btn:hover {
    background: rgba(0, 212, 255, 0.1);
}

.header-actions .danger-btn {
    color: rgba(255, 255, 255, 0.4);
}

.header-actions .danger-btn:hover {
    color: #f43f5e;
    background: rgba(244, 63, 94, 0.1);
}

/* User Info Panel */
.user-info-panel {
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(0, 212, 255, 0.02);
    flex-shrink: 0;
    animation: slideDown 0.2s ease;
}

@keyframes slideDown {
    from { max-height: 0; opacity: 0; }
    to { max-height: 300px; opacity: 1; }
}

.info-panel-inner {
    padding: 20px 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

.info-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(0, 212, 255, 0.3);
    margin-bottom: 10px;
}

.info-panel-inner h4 {
    color: #fff;
    margin: 0 0 4px;
    font-size: 1.1rem;
}

.info-role {
    color: #00d4ff;
    font-size: 0.8rem;
    text-transform: capitalize;
    margin-bottom: 15px;
}

.info-stats {
    display: flex;
    gap: 30px;
    margin-bottom: 15px;
}

.info-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.stat-label {
    font-size: 0.7rem;
    color: rgba(255, 255, 255, 0.4);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.stat-value {
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
}

.info-action-btn {
    background: rgba(0, 212, 255, 0.1);
    border: 1px solid rgba(0, 212, 255, 0.2);
    color: #00d4ff;
    padding: 8px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
}

.info-action-btn:hover {
    background: #00d4ff;
    color: #000;
}

/* Messages Display */
.messages-display {
    flex: 1;
    padding: 25px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.msg-date-divider {
    text-align: center;
    color: rgba(255, 255, 255, 0.3);
    font-size: 0.75rem;
    padding: 10px 0;
    position: relative;
}

.msg-date-divider::before,
.msg-date-divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 30%;
    height: 1px;
    background: rgba(255, 255, 255, 0.1);
}

.msg-date-divider::before { left: 5%; }
.msg-date-divider::after { right: 5%; }

.msg-wrapper {
    max-width: 70%;
    display: flex;
    flex-direction: column;
    position: relative;
    padding-left: 50px;  /* space for action buttons */
    padding-right: 0;
}

.msg-wrapper.sent {
    align-self: flex-end;
    padding-left: 50px;
    padding-right: 0;
}

.msg-wrapper.received {
    align-self: flex-start;
    padding-left: 0;
    padding-right: 50px;
}

.msg-bubble {
    padding: 12px 18px;
    border-radius: 18px;
    font-size: 0.95rem;
    line-height: 1.5;
    position: relative;
    word-wrap: break-word;
    overflow-wrap: break-word;
}

.sent .msg-bubble {
    background: linear-gradient(135deg, #00d4ff 0%, #008eb3 100%);
    color: #fff;
    border-bottom-right-radius: 4px;
}

.received .msg-bubble {
    background: rgba(255, 255, 255, 0.08);
    color: #eee;
    border-bottom-left-radius: 4px;
}

.msg-time {
    font-size: 0.7rem;
    color: rgba(255, 255, 255, 0.3);
    margin-top: 4px;
}

.sent .msg-time { align-self: flex-end; }

.msg-wrapper .msg-actions {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: none;
    gap: 2px;
    background: rgba(20, 20, 35, 0.9);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 4px;
}

.sent .msg-actions { left: 0; }
.received .msg-actions { right: 0; }

.msg-wrapper:hover .msg-actions { display: flex; }

.msg-action-btn {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.5);
    cursor: pointer;
    padding: 6px 8px;
    transition: all 0.15s;
    border-radius: 5px;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
}

.msg-action-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
}

.msg-action-btn.btn-delete:hover { color: #f43f5e; }
.msg-action-btn.btn-edit:hover { color: #00d4ff; }

/* Edit mode inline */
.msg-edit-area {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    align-items: flex-end;
}

.msg-edit-area textarea {
    flex: 1;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-radius: 10px;
    color: #fff;
    padding: 8px 12px;
    font-size: 0.9rem;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 36px;
}

.msg-edit-area textarea:focus {
    border-color: #00d4ff;
}

.msg-edit-area button {
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    transition: all 0.15s;
}

.msg-edit-save {
    background: #00d4ff;
    color: #000;
}

.msg-edit-save:hover {
    background: #33dfff;
}

.msg-edit-cancel {
    background: rgba(255, 255, 255, 0.1);
    color: #aaa;
}

.msg-edit-cancel:hover {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
}

.msg-edited-tag {
    font-size: 0.65rem;
    color: rgba(255, 255, 255, 0.3);
    font-style: italic;
}

/* Image messages */
.msg-image {
    max-width: 300px;
    max-height: 300px;
    border-radius: 12px;
    cursor: pointer;
    object-fit: cover;
    transition: transform 0.2s, box-shadow 0.2s;
    display: block;
}

.msg-image:hover {
    transform: scale(1.02);
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
}

.sent .msg-image-bubble {
    background: transparent;
    padding: 4px;
}

.received .msg-image-bubble {
    background: transparent;
    padding: 4px;
}

.msg-caption {
    font-size: 0.9rem;
    margin-top: 6px;
    padding: 0 4px;
    color: rgba(255, 255, 255, 0.85);
}

/* Image preview strip */
.img-preview-strip {
    margin-bottom: 10px;
}

.img-preview-inner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(0, 212, 255, 0.2);
    border-radius: 12px;
    padding: 8px 12px;
}

.img-preview-inner img {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    object-fit: cover;
}

.img-preview-inner span {
    flex: 1;
    color: rgba(255, 255, 255, 0.6);
    font-size: 0.85rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.img-preview-cancel {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.4);
    cursor: pointer;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.15s;
}

.img-preview-cancel:hover {
    background: rgba(244, 63, 94, 0.15);
    color: #f43f5e;
}

/* Lightbox */
.msg-lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
    animation: fadeIn 0.2s ease;
}

.msg-lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 8px;
    box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* GIF button label */
.gif-label {
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

.gif-toggle.active .gif-label {
    color: #00d4ff;
}

/* GIF Picker */
.gif-picker {
    position: absolute;
    bottom: 75px;
    left: 25px;
    width: 380px;
    background: #1a1a2e;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    z-index: 30;
    animation: fadeInUp 0.15s ease;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.gif-search-box {
    display: flex;
    align-items: center;

<script>
document.addEventListener('DOMContentLoaded', function() {
    const MY_USER_ID = {{ session['user_id'] }};
    let currentChatUserId = {{ target_user_id or 'null' }};
    let currentChatUsername = null;
    let currentChatAvatar = null;
    let pollingInterval = null;
    let searchMode = false;  // true = searching users, false = filtering convos
    let searchTimeout = null;
    let allConversations = []; // cached for client-side filtering

    // DOM elements
    const conversationsList = document.getElementById('conversationsList');
    const messagesDisplay = document.getElementById('messagesDisplay');
    const chatEmptyState = document.getElementById('chatEmptyState');
    const chatContent = document.getElementById('chatContent');
    const messageInput = document.getElementById('messageInput');
    const sendMessageBtn = document.getElementById('sendMessageBtn');
    const convoSearch = document.getElementById('convoSearch');
    const userSearchResults = document.getElementById('userSearchResults');
    const userInfoPanel = document.getElementById('userInfoPanel');

    // ========================================
    // SEARCH: Conversations + New User Search
    // ========================================
    convoSearch.addEventListener('input', function() {
        const query = this.value.trim();
        
        if (searchTimeout) clearTimeout(searchTimeout);
        
        if (!query) {
            userSearchResults.classList.add('hidden');
            renderConversations(allConversations);
            return;
        }

        // Client-side filter existing conversations
        const filtered = allConversations.filter(c => 
            c.username.toLowerCase().includes(query.toLowerCase())
        );
        renderConversations(filtered);

        // Also search for new users (debounced)
        if (query.length >= 2) {
            searchTimeout = setTimeout(() => searchUsers(query), 300);
        } else {
            userSearchResults.classList.add('hidden');
        }
    });

    async function searchUsers(query) {
        try {
            const response = await fetch(`/api/messages/search_users?q=${encodeURIComponent(query)}`);
            const users = await response.json();
            
            // Filter out users we already have conversations with
            const existingIds = new Set(allConversations.map(c => c.other_user_id));
            const newUsers = users.filter(u => !existingIds.has(u.id));
            
            if (newUsers.length === 0) {
                userSearchResults.classList.add('hidden');
                return;
            }

            userSearchResults.innerHTML = '<div class="search-hint">Start a new conversation</div>';
            newUsers.forEach(user => {
                const avatar = user.avatar_url || '/static/img/default_avatar.png';
                const item = document.createElement('div');
                item.className = 'user-result-item';
                item.innerHTML = `
                    <img src="${avatar}" alt="">
                    <div class="user-result-info">
                        <span class="name">${user.username}</span>
                        <span class="role">${user.role || 'member'}</span>
                    </div>
                `;
                item.addEventListener('click', () => {
                    selectUser(user.id, user.username, avatar);
                    convoSearch.value = '';
                    userSearchResults.classList.add('hidden');
                });
                userSearchResults.appendChild(item);
            });
            userSearchResults.classList.remove('hidden');
        } catch (err) {
            console.error('Error searching users:', err);
        }
    }

    // Close search results when clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.sidebar-header')) {
            userSearchResults.classList.add('hidden');
        }
    });

    // ========================================
    // NEW CHAT BUTTON
    // ========================================
    document.getElementById('newChatBtn').addEventListener('click', () => {
        convoSearch.focus();
        convoSearch.value = '';
        convoSearch.placeholder = 'Search for a user...';
    });

    // ========================================
    // CONVERSATIONS
    // ========================================
    async function loadConversations() {
        try {
            const response = await fetch('/api/messages/conversations');
            allConversations = await response.json();
            renderConversations(allConversations);
        } catch (err) {
            console.error('Error loading conversations:', err);
        }
    }

    function renderConversations(conversations) {
        conversationsList.innerHTML = '';
        
        if (conversations.length === 0) {
            conversationsList.innerHTML = '<div class="loading-state"><p>No conversations yet</p></div>';
            return;
        }

        conversations.forEach(convo => {
            const isActive = currentChatUserId === convo.other_user_id;
            const isUnread = convo.unread_count > 0;
            const avatar = convo.avatar_url || '/static/img/default_avatar.png';
            
            const item = document.createElement('div');
            item.className = `convo-item ${isActive ? 'active' : ''} ${isUnread ? 'unread' : ''}`;
            item.dataset.userId = convo.other_user_id;
            
            const preview = escapeHtml(convo.content).substring(0, 40);
            
            item.innerHTML = `
                <img src="${avatar}" class="convo-avatar">
                <div class="convo-info">
                    <div class="top">
                        <h4>${escapeHtml(convo.username)}</h4>
                        <span class="time">${formatTime(convo.timestamp)}</span>
                    </div>
                    <span class="last-msg">${convo.sender_id === MY_USER_ID ? 'You: ' : ''}${convo.image_url ? '📷 Photo' : preview}</span>
                </div>
                ${isUnread ? '<div class="unread-dot"></div>' : ''}
            `;
            
            item.addEventListener('click', () => selectUser(convo.other_user_id, convo.username, avatar));
            conversationsList.appendChild(item);
        });
    }

    // ========================================
    // SELECT USER / OPEN CHAT
    // ========================================
    async function selectUser(userId, username, avatar) {
        currentChatUserId = userId;
        currentChatUsername = username;
        currentChatAvatar = avatar;
        
        // Highlight active conversation
        document.querySelectorAll('.convo-item').forEach(i => i.classList.remove('active'));
        const activeItem = document.querySelector(`.convo-item[data-user-id="${userId}"]`);
        if (activeItem) {
            activeItem.classList.add('active');
            activeItem.classList.remove('unread');
            const dot = activeItem.querySelector('.unread-dot');
            if (dot) dot.remove();
        }

        // Show chat
        chatEmptyState.classList.add('hidden');
        chatContent.classList.remove('hidden');
        userInfoPanel.classList.add('hidden');
        
        document.getElementById('chatUserName').textContent = username;
        document.getElementById('chatUserAvatar').src = avatar;

        // Load messages
        messagesDisplay.innerHTML = '<div class="loading-state"><div class="spinner"></div></div>';
        
        await loadMessages();
        markAsRead(userId);
        
        // Start polling
        if (pollingInterval) clearInterval(pollingInterval);
        pollingInterval = setInterval(loadMessages, 3000);
        
        messageInput.focus();
    }

    // ========================================
    // MESSAGES
    // ========================================
    let lastMessageCount = 0;

    async function loadMessages() {
        if (!currentChatUserId) return;

        try {
            const response = await fetch(`/api/messages/history/${currentChatUserId}`);
            const messages = await response.json();
            
            // Only re-render if message count changed (optimization)
            if (messages.length === lastMessageCount && messagesDisplay.children.length > 0 && !messagesDisplay.querySelector('.spinner')) {
                return;
            }
            lastMessageCount = messages.length;

            const wasAtBottom = messagesDisplay.scrollHeight - messagesDisplay.scrollTop <= messagesDisplay.clientHeight + 100;
            
            messagesDisplay.innerHTML = '';
            
            let lastDate = '';
            messages.forEach(msg => {
                const msgDate = new Date(msg.timestamp.replace(' ', 'T')).toLocaleDateString();
                if (msgDate !== lastDate) {
                    lastDate = msgDate;
                    const divider = document.createElement('div');
                    divider.className = 'msg-date-divider';
                    divider.textContent = formatDateLabel(msg.timestamp);
                    messagesDisplay.appendChild(divider);
                }

                const isSent = msg.sender_id === MY_USER_ID;
                const isEdited = msg.edited === 1;
                const hasImage = msg.image_url;
                const div = document.createElement('div');
                div.className = `msg-wrapper ${isSent ? 'sent' : 'received'}`;
                div.dataset.msgId = msg.id;
                
                let bubbleContent = '';
                if (hasImage) {
                    bubbleContent = `
                        <div class="msg-image-bubble">
                            <img src="${msg.image_url}" class="msg-image" onclick="openLightbox('${msg.image_url}')" alt="Shared image">
                            ${msg.content ? `<div class="msg-caption">${escapeHtml(msg.content)}</div>` : ''}
                        </div>
                    `;
                } else {
                    bubbleContent = `<div class="msg-bubble" id="bubble-${msg.id}">${escapeHtml(msg.content)}</div>`;
                }
                
                div.innerHTML = `
                    ${bubbleContent}
                    <span class="msg-time">${formatTime(msg.timestamp, true)}${isEdited ? ' <span class="msg-edited-tag">(edited)</span>' : ''}</span>
                    ${isSent ? `
                        <div class="msg-actions">
                            ${!hasImage ? `<button class="msg-action-btn btn-edit" onclick="editMessage(${msg.id}, this)" title="Edit">
                                <i class="fas fa-pen"></i>
                            </button>` : ''}
                            <button class="msg-action-btn btn-delete" onclick="deleteMessage(${msg.id}, this)" title="Delete">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    ` : ''}
                `;
                messagesDisplay.appendChild(div);
            });

            if (wasAtBottom || messagesDisplay.querySelector('.spinner')) {
                messagesDisplay.scrollTop = messagesDisplay.scrollHeight;
            }
        } catch (err) {
            console.error('Error loading messages:', err);
        }
    }

    // ========================================
    // SEND MESSAGE (text + optional image)
    // ========================================
    let pendingImageFile = null;

    async function sendMsg() {
        const content = messageInput.value.trim();
        const hasImage = pendingImageFile !== null;
        
        if (!content && !hasImage) return;
        if (!currentChatUserId) return;

        messageInput.value = '';
        messageInput.style.height = 'auto';

        try {
            let imageUrl = null;

            // Upload image first if present
            if (hasImage) {
                sendMessageBtn.disabled = true;
                sendMessageBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                
                const formData = new FormData();
                formData.append('image', pendingImageFile);
                
                const uploadRes = await fetch('/api/messages/upload_image', {
                    method: 'POST',
                    body: formData
                });
                
                if (uploadRes.ok) {
                    const uploadData = await uploadRes.json();
                    imageUrl = uploadData.url;
                } else {
                    showToast('Failed to upload image', true);
                    sendMessageBtn.disabled = false;
                    sendMessageBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
                    return;
                }
                
                clearImagePreview();
            }

            // Send message
            const payload = {
                receiver_id: currentChatUserId,
                content: content || ''
            };
            if (imageUrl) payload.image_url = imageUrl;

            const response = await fetch('/api/messages/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (response.ok) {
                lastMessageCount = 0;
                await loadMessages();
                loadConversations();
            } else {
                showToast('Failed to send message', true);
            }
        } catch (err) {
            showToast('Network error', true);
        } finally {
            sendMessageBtn.disabled = false;
            sendMessageBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
        }
    }

    sendMessageBtn.addEventListener('click', sendMsg);
    messageInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMsg();
        }
    });

    // Auto-resize textarea
    messageInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    // ========================================
    // MARK AS READ
    // ========================================
    async function markAsRead(userId) {
        try {
            await fetch(`/api/messages/mark_read/${userId}`, { method: 'POST' });
            loadConversations();
            if (typeof updateUnreadBadge === 'function') updateUnreadBadge();
        } catch (err) {}
    }

    // ========================================
    // DELETE INDIVIDUAL MESSAGE
    // ========================================
    window.deleteMessage = async function(id, btn) {
        if (!confirm('Delete this message?')) return;
        
        try {
            const response = await fetch(`/api/messages/${id}`, { method: 'DELETE' });
            if (response.ok) {
                const wrapper = btn.closest('.msg-wrapper');
                wrapper.style.transition = 'all 0.3s ease';
                wrapper.style.opacity = '0';
                wrapper.style.transform = 'scale(0.8)';
                setTimeout(() => {
                    wrapper.remove();
                    lastMessageCount--;
                }, 300);
                showToast('Message deleted');
            }
        } catch (err) {
            showToast('Failed to delete', true);
        }
    };

    // ========================================
    // EDIT MESSAGE
    // ========================================
    window.editMessage = function(id, btn) {
        const wrapper = btn.closest('.msg-wrapper');
        const bubble = wrapper.querySelector('.msg-bubble');
        const originalText = bubble.textContent;

        // Don't allow double edit
        if (wrapper.querySelector('.msg-edit-area')) return;

        // Hide the bubble, show an edit area
        bubble.style.display = 'none';
        wrapper.querySelector('.msg-actions').style.display = 'none';

        const editArea = document.createElement('div');
        editArea.className = 'msg-edit-area';
        editArea.innerHTML = `
            <textarea rows="1">${originalText}</textarea>
            <button class="msg-edit-save" onclick="saveEdit(${id}, this)">Save</button>
            <button class="msg-edit-cancel" onclick="cancelEdit(this)">✕</button>
        `;
        
        // Insert after bubble
        bubble.after(editArea);
        
        const textarea = editArea.querySelector('textarea');
        textarea.focus();
        textarea.style.height = textarea.scrollHeight + 'px';
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });
        textarea.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                saveEdit(id, editArea.querySelector('.msg-edit-save'));
            }
        });
    };

    window.saveEdit = async function(id, btn) {
        const editArea = btn.closest('.msg-edit-area');
        const wrapper = editArea.closest('.msg-wrapper');
        const bubble = wrapper.querySelector('.msg-bubble');
        const newContent = editArea.querySelector('textarea').value.trim();

        if (!newContent) {
            showToast('Message cannot be empty', true);
            return;
        }

        btn.disabled = true;
        btn.textContent = '...';

        try {
            const response = await fetch(`/api/messages/${id}/edit`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: newContent })
            });

            if (response.ok) {
                bubble.textContent = newContent;
                bubble.style.display = '';
                editArea.remove();
                
                // Add (edited) tag if not already there
                const timeSpan = wrapper.querySelector('.msg-time');
                if (!timeSpan.querySelector('.msg-edited-tag')) {
                    timeSpan.innerHTML += ' <span class="msg-edited-tag">(edited)</span>';
                }
                
                showToast('Message edited');
            } else {
                showToast('Failed to edit', true);
            }
        } catch (err) {
            showToast('Network error', true);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Save';
        }
    };

    window.cancelEdit = function(btn) {
        const editArea = btn.closest('.msg-edit-area');
        const wrapper = editArea.closest('.msg-wrapper');
        const bubble = wrapper.querySelector('.msg-bubble');
        bubble.style.display = '';
        editArea.remove();
    };

    // ========================================
    // HEADER ACTIONS
    // ========================================

    // Visit Profile
    document.getElementById('btnVisitProfile').addEventListener('click', () => {
        if (currentChatUsername) {
            window.location.href = `/u/${currentChatUsername}`;
        }
    });

    // Delete Conversation
    document.getElementById('btnDeleteConvo').addEventListener('click', async () => {
        if (!currentChatUserId) return;
        if (!confirm(`Delete entire conversation with ${currentChatUsername}? This cannot be undone.`)) return;
        
        try {
            const response = await fetch(`/api/messages/conversation/${currentChatUserId}`, { method: 'DELETE' });
            if (response.ok) {
                // Reset chat view
                chatContent.classList.add('hidden');
                chatEmptyState.classList.remove('hidden');
                currentChatUserId = null;
                currentChatUsername = null;
                lastMessageCount = 0;
                if (pollingInterval) clearInterval(pollingInterval);
                loadConversations();
                showToast('Conversation deleted');
            }
        } catch (err) {
            showToast('Failed to delete conversation', true);
        }
    });

    // Toggle Info Panel
    document.getElementById('btnToggleInfo').addEventListener('click', async () => {
        if (userInfoPanel.classList.contains('hidden')) {
            // Show panel & populate
            document.getElementById('infoPanelAvatar').src = currentChatAvatar;
            document.getElementById('infoPanelName').textContent = currentChatUsername;
            
            // Get message count & first message date
            try {
                const res = await fetch(`/api/messages/history/${currentChatUserId}`);
                const msgs = await res.json();
                document.getElementById('infoPanelMsgCount').textContent = msgs.length;
                if (msgs.length > 0) {
                    const firstDate = new Date(msgs[0].timestamp.replace(' ', 'T'));
                    document.getElementById('infoPanelSince').textContent = firstDate.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
                }
            } catch(e) {}

            // Get user role
            try {
                const res = await fetch(`/api/messages/search_users?q=${encodeURIComponent(currentChatUsername)}`);
                const users = await res.json();
                const user = users.find(u => u.username === currentChatUsername);
                document.getElementById('infoPanelRole').textContent = user ? user.role : 'member';
            } catch(e) {
                document.getElementById('infoPanelRole').textContent = 'member';
            }

            userInfoPanel.classList.remove('hidden');
        } else {
            userInfoPanel.classList.add('hidden');
        }
    });

    // Info panel "View Full Profile" button
    document.getElementById('infoPanelProfileBtn').addEventListener('click', () => {
        if (currentChatUsername) {
            window.location.href = `/u/${currentChatUsername}`;
        }
    });

    // ========================================
    // EMOJI PICKER
    // ========================================
    const emojis = ['😀','😂','😍','🥰','😎','🤔','😭','🔥','❤️','👍','👎','🎉','✨','💯','🙌','😊',
                    '🤣','😅','😇','🥺','😤','😱','🤗','😴','🤮','💀','👻','🎶','💪','🙏','✌️','🤝',
                    '📚','📖','✍️','💡','🌟','🏆','💎','🎯','🎮','🎬','🎨','🎵','☕','🍕','👀','💬'];

    const emojiGrid = document.getElementById('emojiGrid');
    const emojiPicker = document.getElementById('emojiPicker');
    const emojiToggle = document.getElementById('emojiToggle');

    emojis.forEach(emoji => {
        const btn = document.createElement('button');
        btn.textContent = emoji;
        btn.type = 'button';
        btn.addEventListener('click', () => {
            messageInput.value += emoji;
            messageInput.focus();
        });
        emojiGrid.appendChild(btn);
    });

    emojiToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        emojiPicker.classList.toggle('hidden');
        emojiToggle.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.emoji-picker') && !e.target.closest('.emoji-toggle')) {
            emojiPicker.classList.add('hidden');
            emojiToggle.classList.remove('active');
        }
    });

    // ========================================
    // IMAGE UPLOAD
    // ========================================
    const imgUploadBtn = document.getElementById('imgUploadBtn');
    const imgFileInput = document.getElementById('imgFileInput');
    const imgPreviewStrip = document.getElementById('imgPreviewStrip');
    const imgPreviewThumb = document.getElementById('imgPreviewThumb');
    const imgPreviewName = document.getElementById('imgPreviewName');
    const imgPreviewCancel = document.getElementById('imgPreviewCancel');

    imgUploadBtn.addEventListener('click', () => {
        imgFileInput.click();
    });

    imgFileInput.addEventListener('change', function() {
        const file = this.files[0];
        if (!file) return;
        
        // Validate file
        if (!file.type.startsWith('image/')) {
            showToast('Please select an image file', true);
            this.value = '';
            return;
        }
        
        if (file.size > 10 * 1024 * 1024) { // 10MB limit
            showToast('Image must be under 10MB', true);
            this.value = '';
            return;
        }

        pendingImageFile = file;
        
        // Show preview
        const reader = new FileReader();
        reader.onload = (e) => {
            imgPreviewThumb.src = e.target.result;
            imgPreviewName.textContent = file.name;
            imgPreviewStrip.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
    });

    imgPreviewCancel.addEventListener('click', clearImagePreview);

    function clearImagePreview() {
        pendingImageFile = null;
        imgFileInput.value = '';
        imgPreviewStrip.classList.add('hidden');
        imgPreviewThumb.src = '';
        imgPreviewName.textContent = '';
    }

    // ========================================
    // PASTE & DRAG-DROP IMAGE/GIF SUPPORT
    // ========================================
    // Handles: Win+. GIF picker, Ctrl+V image paste, mobile keyboard GIFs, drag-drop
    
    function handlePastedFile(file) {
        if (!file || !file.type.startsWith('image/')) return false;
        if (file.size > 10 * 1024 * 1024) {
            showToast('Image must be under 10MB', true);
            return true;
        }
        
        pendingImageFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
            imgPreviewThumb.src = e.target.result;
            imgPreviewName.textContent = file.name || 'Pasted image';
            imgPreviewStrip.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
        return true;
    }

    // Clipboard paste (Ctrl+V, Win+. GIF, right-click paste)
    document.addEventListener('paste', function(e) {
        // Only handle when chat is active
        if (!currentChatUserId) return;
        
        const items = e.clipboardData?.items;
        if (!items) return;
        
        for (const item of items) {
            if (item.type.startsWith('image/')) {
                e.preventDefault();
                const file = item.getAsFile();
                if (file) {
                    handlePastedFile(file);
                    messageInput.focus();
                }
                return;
            }
        }
    });

    // Drag and drop onto chat area
    const chatMain = document.getElementById('chatMain');
    
    chatMain.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.stopPropagation();
        this.style.outline = '2px dashed rgba(0, 212, 255, 0.4)';
        this.style.outlineOffset = '-8px';
    });

    chatMain.addEventListener('dragleave', function(e) {
        e.preventDefault();
        this.style.outline = 'none';
    });

    chatMain.addEventListener('drop', function(e) {
        e.preventDefault();
        e.stopPropagation();
        this.style.outline = 'none';
        
        if (!currentChatUserId) return;
        
        const files = e.dataTransfer?.files;
        if (files && files.length > 0) {
            const file = files[0];
            if (file.type.startsWith('image/')) {
                handlePastedFile(file);
            } else {
                showToast('Only image files are supported', true);
            }
        }
    });

    // Lightbox
    window.openLightbox = function(src) {
        const lb = document.createElement('div');
        lb.className = 'msg-lightbox';
        lb.innerHTML = `<img src="${src}">`;
        lb.addEventListener('click', () => lb.remove());
        document.body.appendChild(lb);
    };

    // ========================================
    // GIF PICKER
    // ========================================
    const gifPicker = document.getElementById('gifPicker');
    const gifToggle = document.getElementById('gifToggle');
    const gifSearchInput = document.getElementById('gifSearchInput');
    const gifResults = document.getElementById('gifResults');
    let gifSearchTimeout = null;
    let gifPickerOpen = false;

    gifToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        gifPickerOpen = !gifPickerOpen;

        if (gifPickerOpen) {
            gifPicker.classList.remove('hidden');
            gifToggle.classList.add('active');
            // Close emoji picker if open
            emojiPicker.classList.add('hidden');
            emojiToggle.classList.remove('active');
            // Load trending on first open
            loadGifs('');
            gifSearchInput.focus();
        } else {
            gifPicker.classList.add('hidden');
            gifToggle.classList.remove('active');
        }
    });

    // Close GIF picker when clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.gif-picker') && !e.target.closest('.gif-toggle')) {
            gifPicker.classList.add('hidden');
            gifToggle.classList.remove('active');
            gifPickerOpen = false;
        }
    });

    // Also close emoji when opening GIF
    emojiToggle.addEventListener('click', () => {
        gifPicker.classList.add('hidden');
        gifToggle.classList.remove('active');
        gifPickerOpen = false;
    });

    // Search input
    gifSearchInput.addEventListener('input', function() {
        const query = this.value.trim();
        if (gifSearchTimeout) clearTimeout(gifSearchTimeout);
        gifSearchTimeout = setTimeout(() => {
            loadGifs(query);
            // Update active category
            document.querySelectorAll('.gif-cat').forEach(c => c.classList.remove('active'));
        }, 300);
    });

    // Category tabs
    document.querySelectorAll('.gif-cat').forEach(btn => {
        btn.addEventListener('click', function() {
            const q = this.dataset.q;
            document.querySelectorAll('.gif-cat').forEach(c => c.classList.remove('active'));
            this.classList.add('active');
            gifSearchInput.value = q;
            loadGifs(q);
        });
    });

    // Fetch GIFs from backend proxy
    async function loadGifs(query) {
        gifResults.innerHTML = '<div class="loading-state"><div class="spinner"></div></div>';

        try {
            const endpoint = query
                ? `/api/gifs/search?q=${encodeURIComponent(query)}`
                : '/api/gifs/trending';
            
            const response = await fetch(endpoint);
            const data = await response.json();

            if (!data.results || data.results.length === 0) {
                gifResults.innerHTML = '<div class="gif-no-results">No GIFs found</div>';
                return;
            }

            gifResults.innerHTML = '';
            data.results.forEach(gif => {
                const item = document.createElement('div');
                item.className = 'gif-item';
                item.innerHTML = `<img src="${gif.preview}" alt="GIF" loading="lazy">`;
                item.addEventListener('click', () => sendGif(gif.url));
                gifResults.appendChild(item);
            });
        } catch (err) {
            gifResults.innerHTML = '<div class="gif-no-results">Failed to load GIFs</div>';
            console.error('GIF load error:', err);
        }
    }

    // Send a GIF as an image message
    async function sendGif(gifUrl) {
        if (!currentChatUserId) return;

        // Close the picker
        gifPicker.classList.add('hidden');
        gifToggle.classList.remove('active');
        gifPickerOpen = false;

        try {
            const response = await fetch('/api/messages/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    receiver_id: currentChatUserId,
                    content: '',
                    image_url: gifUrl
                })
            });

            if (response.ok) {
                lastMessageCount = 0;
                await loadMessages();
                loadConversations();
            } else {
                showToast('Failed to send GIF', true);
            }
        } catch (err) {
            showToast('Network error', true);
        }
    }

    // ========================================
    // HELPERS
    // ========================================
    function formatTime(timestamp, detail = false) {
        const date = new Date(timestamp.replace(' ', 'T'));
        if (isNaN(date)) return timestamp;
        if (detail) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        const now = new Date();
        const diff = (now - date) / 1000;

        if (diff < 60) return 'Just now';
        if (diff < 3600) return Math.floor(diff / 60) + 'm';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h';
        if (diff < 172800) return 'Yesterday';
        return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    function formatDateLabel(timestamp) {
        const date = new Date(timestamp.replace(' ', 'T'));
        const now = new Date();
        const diffDays = Math.floor((now - date) / 86400000);
        if (diffDays === 0) return 'Today';
        if (diffDays === 1) return 'Yesterday';
        return date.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function showToast(message, isError = false) {
        const existing = document.querySelector('.msg-toast');
        if (existing) existing.remove();
        
        const toast = document.createElement('div');
        toast.className = `msg-toast ${isError ? 'error' : ''}`;
        toast.textContent = message;
        document.body.appendChild(toast);
        
        requestAnimationFrame(() => toast.classList.add('show'));
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 2500);
    }

    // ========================================
    // INIT
    // ========================================
    loadConversations();

    // If pre-selected user via query param, initiate chat
    if (currentChatUserId) {
        (async function() {
            // Wait briefly for conversations to load, then try to find user info
            await loadConversations();
            const convo = allConversations.find(c => c.other_user_id === currentChatUserId);
            if (convo) {
                selectUser(convo.other_user_id, convo.username, convo.avatar_url || '/static/img/default_avatar.png');
            } else {
                // User not in conversations yet, fetch their info
                try {
                    const res = await fetch(`/api/messages/search_users?q=`);
                    // Fallback: just open with ID, username will show after first message
                    selectUser(currentChatUserId, 'User', '/static/img/default_avatar.png');
                } catch(e) {
                    selectUser(currentChatUserId, 'User', '/static/img/default_avatar.png');
                }
            }
        })();
    }
});
</script>
{% endblock %}

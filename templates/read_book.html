{% extends "base.html" %}

{% block title %}{{ book_data.title }} - Reader | NOVUS{% endblock %}

{% block content %}
<style>
    /* Ensure reader fills remaining viewport height */
    .main-content {
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 0 30px 0 0 !important;
        /* Right padding only to avoid double padding with sidebar */
    }

    .top-header-minimal {
        margin-bottom: 0 !important;
    }

    /* Reader container fills available space */
    .reader-container {
        width: 100%;
        height: 100%;
        max-height: 100%;
        background: #0f172a;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        user-select: none;
    }

    /* React app root */
    #root {
        width: 100%;
        height: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* Hide flash messages in reader */
    .flash-container {
        display: none !important;
    }

    /* Tailwind CDN styles for reader */
    ::-webkit-scrollbar {
        width: 6px;
    }

    ::-webkit-scrollbar-track {
        background: transparent;
    }

    ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
    }

    .highlight-active {
        background-color: #fde047;
        border-radius: 4px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 0 15px rgba(253, 224, 71, 0.6);
    }

    .reading-highlight {
        background-color: rgba(251, 191, 36, 0.2);
        border-bottom: 2px solid #fbbf24;
        border-radius: 2px;
        padding: 1px 0;
        transition: all 0.4s ease;
        position: relative;
        z-index: 5;
        box-shadow: 0 2px 4px rgba(251, 191, 36, 0.1);
    }

    .reading-highlight::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: -2px;
        width: 100%;
        height: 2px;
        background: #fbbf24;
        box-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
    }

    /* Rich Content Styles for Summary */
    .rich-content h1 {
        font-size: 1.875rem !important;
        font-weight: 700 !important;
        color: #1e293b !important;
        margin-bottom: 1.5rem !important;
        margin-top: 2rem !important;
        border-bottom: 2px solid #f1f5f9 !important;
        padding-bottom: 0.75rem !important;
        display: block !important;
        text-align: left !important;
    }

    .rich-content h1:first-child {
        margin-top: 0 !important;
    }

    .rich-content h2 {
        font-size: 1.5rem !important;
        font-weight: 600 !important;
        color: #334155 !important;
        margin-bottom: 1rem !important;
        margin-top: 1.5rem !important;
        display: block !important;
        text-align: left !important;
    }

    .rich-content h3 {
        font-size: 1.25rem !important;
        font-weight: 600 !important;
        color: #475569 !important;
        margin-bottom: 0.75rem !important;
        margin-top: 1.25rem !important;
        display: block !important;
        text-align: left !important;
    }

    .rich-content p {
        margin-bottom: 1.25rem !important;
        line-height: 1.8 !important;
        display: block !important;
        text-align: justify !important;
    }

    .rich-content ul,
    .rich-content ol {
        margin-bottom: 1.25rem !important;
        padding-left: 1.5rem !important;
        display: block !important;
    }

    .rich-content ul {
        list-style-type: disc !important;
    }

    .rich-content ol {
        list-style-type: decimal !important;
    }

    .rich-content li {
        margin-bottom: 0.5rem !important;
        display: list-item !important;
    }

    .rich-content strong,
    .rich-content b {
        font-weight: 700 !important;
        color: #0f172a !important;
    }

    .rich-content a {
        color: #4f46e5 !important;
        text-decoration: underline !important;
        font-weight: 600 !important;
        cursor: pointer !important;
        transition: color 0.2s !important;
    }

    .rich-content a:hover {
        color: #312e81 !important;
    }

    /* High-visibility selection */
    ::selection {
        background-color: rgba(79, 70, 229, 0.2) !important;
        /* Soft Indigo Selection */
        color: inherit !important;
    }

    /* For specific reader area to be even more clear */
    .reader-container ::selection {
        background-color: rgba(79, 70, 229, 0.3) !important;
        /* Slightly more opaque indigo for reader */
        color: inherit !important;
    }

    /* Increase line-height to prevent selection overlap */
    .rich-content,
    .reader-container p,
    .reader-container div {
        line-height: 1.8 !important;
    }
</style>

<!-- TailwindCSS for React components -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Pass book data to React app -->
<script>
    window.__BOOK_DATA__ = {{ book_data | tojson | safe }};
</script>

<!-- PDF.js for native PDF rendering -->
<script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs';
    window.pdfjsLib = pdfjsLib;
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';
</script>

<!-- Import maps for React dependencies -->
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "pdfjs-dist": "https://esm.sh/pdfjs-dist@4.0.379"
  }
}
</script>

<div class="reader-container">
    <div id="root"></div>
</div>

<!-- Load the built React app -->
<script type="module" crossorigin src="/static/lumina-reader/dist/assets/index-BSIj__1m.js"></script>
{% endblock %}

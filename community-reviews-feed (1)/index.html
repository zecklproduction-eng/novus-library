
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Reviews | MediaHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        
        /* Card-level blur for heavy spoilers */
        .spoiler-blur-container {
            filter: blur(12px);
            user-select: none;
            pointer-events: none;
            transition: filter 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .spoilers-revealed .spoiler-blur-container {
            filter: blur(0);
            user-select: auto;
            pointer-events: auto;
        }

        /* Inline spoiler spans identification */
        .spoiler {
            background-color: #1e293b; /* slate-800 */
            color: transparent;
            filter: blur(5px);
            border-radius: 4px;
            padding: 0 4px;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .spoiler:hover {
            filter: blur(3px);
            background-color: #334155; /* slate-700 */
        }

        .spoilers-revealed .spoiler,
        .spoiler.revealed {
            background-color: #f1f5f9; /* slate-100 */
            color: #475569; /* slate-600 */
            filter: blur(0);
            user-select: auto;
            cursor: text;
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* World-Class Like Button Animations */
        @keyframes like-heart-pop {
            0% { transform: scale(1); }
            15% { transform: scale(0.7); }
            35% { transform: scale(1.5) rotate(-15deg); }
            55% { transform: scale(0.9) rotate(10deg); }
            75% { transform: scale(1.1) rotate(-5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        @keyframes count-number-jump {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes shockwave {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2.4); opacity: 0; }
        }

        .animate-like-pop {
            animation: like-heart-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .animate-number-jump {
            animation: count-number-jump 0.4s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        .animate-shockwave {
            animation: shockwave 0.5s ease-out forwards;
        }

        /* Custom Scrollbar for a premium look */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
